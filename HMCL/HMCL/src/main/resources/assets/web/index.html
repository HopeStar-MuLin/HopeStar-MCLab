<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MCLab</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-theme="light">

<!-- ============ 自绘标题栏 ============ -->
<header class="titlebar">
  <div class="tb-brand">
    <div class="brand-mark"></div>
    <strong>MCLab</strong>
  </div>
  <div class="tb-drag"></div>
  <div class="tb-actions">
    <button class="icon-btn" id="btn-theme" title="切换主题">
      <svg viewBox="0 0 24 24" class="icon-moon"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      <svg viewBox="0 0 24 24" class="icon-sun"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 2h2v3h-2zm0 17h2v3h-2zM2 11h3v2H2zm17 0h3v2h-3zM4.2 5.6 5.6 4.2l2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
    </button>
    <span class="tb-divider"></span>
    <button class="win-btn" id="win-min" title="最小化">
      <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
    </button>
    <button class="win-btn" id="win-max" title="最大化">
      <svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1"/></svg>
    </button>
    <button class="win-btn close" id="win-close" title="关闭">
      <svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8"/></svg>
    </button>
  </div>
</header>

<div class="desk-body">

  <!-- ============ 侧栏（图标条 ⇄ 展开） ============ -->
  <aside class="rail" id="rail">
    <nav class="rail-nav">
      <button class="rail-item on" data-page="home" title="主页">
        <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        <span class="rail-label">主页</span>
      </button>
      <button class="rail-item" data-page="instances" title="实例">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h10v4H4z"/></svg>
        <span class="rail-label">实例</span>
      </button>
      <button class="rail-item" data-page="appearance" title="外观">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l1 4 4 2-2 4-2-1v9H8v-9l-2 1-2-4 4-2z"/></svg>
        <span class="rail-label">外观</span>
      </button>
      <button class="rail-item" data-page="download" title="下载">
        <svg viewBox="0 0 24 24"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 17.8 6.1 10.9l1.4-1.4L11 13zM5 19h14v2H5z"/></svg>
        <span class="rail-label">下载</span>
      </button>
      <button class="rail-item" data-page="settings" title="设置">
        <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4-.2 1.7 1.7 1.3-1.5 2.6-2-.8a7 7 0 0 1-1.5.9l-.3 2.1h-3l-.3-2.1a7 7 0 0 1-1.5-.9l-2 .8-1.5-2.6 1.7-1.3L3 12l.2-1.7L1.5 9 3 6.4l2 .8a7 7 0 0 1 1.5-.9L6.8 4h3l.3 2.1a7 7 0 0 1 1.5.9l2-.8L15 8.8l-1.7 1.3z"/></svg>
        <span class="rail-label">设置</span>
      </button>
    </nav>

    <div class="rail-foot">
      <!-- 左下角账号 -->
      <button class="account-chip" id="account-chip" title="账号管理">
        <img class="avatar" id="chip-avatar" alt="">
        <span class="chip-meta">
          <strong id="chip-name">未登录</strong>
          <span id="chip-channel">点击添加账号</span>
        </span>
      </button>
      <button class="rail-item sm rail-toggle" id="rail-toggle" title="收起侧栏">
        <svg viewBox="0 0 24 24" class="ico-collapse"><path d="M3 5h18v2H3zM3 11h12v2H3zM3 17h18v2H3zM19.6 10.3 22 12l-2.4 1.7z"/></svg>
        <svg viewBox="0 0 24 24" class="ico-expand"><path d="M3 5h18v2H3zM3 11h12v2H3zM3 17h18v2H3zM15.4 10.3 13 12l2.4 1.7z"/></svg>
        <span class="rail-label" id="rail-toggle-label">收起侧栏</span>
      </button>
    </div>
  </aside>

  <!-- ============ 内容列 ============ -->
  <main class="content">

    <header class="page-head">
      <div class="ph-icon" id="ph-icon"></div>
      <div class="ph-text">
        <div class="ph-title" id="ph-title">主页</div>
        <div class="ph-desc" id="ph-desc"></div>
      </div>
      <div class="ph-acts">
        <button class="kbd-btn" id="btn-refresh" title="刷新数据">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <div class="page-body" id="page-body">

      <!-- ================= 主页 ================= -->
      <section class="page on" id="page-home">
        <div class="hero" id="hero">
          <img class="hero-icon" id="hero-icon" alt="">
          <div class="hero-main">
            <div class="hero-title-row">
              <h2 id="hero-name">没有实例</h2>
              <span class="badge" id="hero-loader">原版</span>
              <span class="badge soft" id="hero-modpack" hidden>整合包</span>
            </div>
            <p class="hero-sub" id="hero-sub">先去下载一个游戏版本</p>
            <div class="hero-meta" id="hero-meta"></div>
          </div>
          <div class="hero-actions">
            <button class="btn primary" id="btn-launch">启动游戏</button>
            <button class="btn ghost" id="btn-folder">打开目录</button>
          </div>
        </div>

        <div class="section-head">
          <h3>实例 <span class="muted small" id="instance-count"></span></h3>
          <button class="link" data-page="instances">查看全部</button>
        </div>
        <div class="grid instances" id="instance-grid"></div>

        <div class="section-head">
          <h3>动态</h3>
          <span class="muted small">来自 Mojang 官方更新日志</span>
        </div>
        <div class="list" id="news-list">
          <div class="empty">正在加载…</div>
        </div>
      </section>

      <!-- ================= 账号 ================= -->
      <section class="page" id="page-accounts">
        <div class="section-head">
          <h3>当前账号</h3>
        </div>
        <div class="account-hero card" id="account-hero">
          <img class="account-avatar" id="account-avatar" alt="">
          <div class="account-info">
            <h2 id="account-name">未登录</h2>
            <p class="muted" id="account-channel">选择一个登录方式</p>
            <p class="muted small" id="account-uuid"></p>
          </div>
          <div class="account-actions">
            <button class="btn ghost" id="btn-account-appearance">更换外观</button>
            <button class="btn ghost" id="btn-account-remove">删除账号</button>
          </div>
        </div>

        <div class="section-head">
          <h3>添加账号</h3>
        </div>
        <div class="grid three stagger">
          <button class="login-card" data-login="offline">
            <span class="login-ico"><svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4 0 7 1.8 7 4v2H5v-2c0-2.2 3-4 7-4z"/></svg></span>
            <strong>离线登录</strong>
            <span>只填用户名，不验证</span>
          </button>
          <button class="login-card" data-login="microsoft">
            <span class="login-ico"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg></span>
            <strong>微软登录</strong>
            <span>正版账号，支持皮肤与披风</span>
          </button>
          <button class="login-card" data-login="authlib">
            <span class="login-ico"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h1V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3zm0 9a2 2 0 0 0-1 3.7V19h2v-2.3A2 2 0 0 0 12 13z"/></svg></span>
            <strong>外置认证</strong>
            <span>LittleSkin 等 authlib-injector 皮肤站</span>
          </button>
        </div>

        <div class="section-head">
          <h3>全部账号</h3>
        </div>
        <div class="account-list" id="account-list"></div>
      </section>

      <!-- ================= 外观 ================= -->
      <section class="page" id="page-appearance">
        <div class="appearance">
          <div class="ap-left">
            <div class="preview-slot" id="preview-slot"><img id="ap-preview" alt="皮肤预览"></div>
            <div class="ap-side">
              <div class="ap-toggles">
                <div class="seg" id="model-seg">
                  <button data-model="default">宽体</button>
                  <button data-model="slim">纤体</button>
                </div>
              </div>
              <button class="btn primary block" id="ap-apply">应用到账号</button>
              <p class="muted small" id="ap-hint"></p>
            </div>
          </div>

          <div class="ap-right">
            <div class="tabs">
              <button class="tab active" data-tab="skin">皮肤</button>
              <button class="tab" data-tab="cape">披风</button>
              <span class="tab-spacer"></span>
              <button class="btn ghost small" id="ap-import">导入文件</button>
            </div>
            <div class="asset-head">
              <span id="asset-head-label">皮肤库</span>
              <span class="asset-count" id="asset-head-count"></span>
            </div>
            <div class="asset-grid" id="asset-grid"></div>
            <p class="muted small" id="ap-tip"></p>
          </div>
        </div>
      </section>

      <!-- ================= 实例 ================= -->
      <section class="page" id="page-instances">
        <div class="section-head"><h3>全部实例</h3></div>
        <div class="table" id="instance-table"></div>
      </section>

      <!-- ================= 下载 ================= -->
      <section class="page" id="page-download">
        <div class="dl-toolbar">
          <div class="seg" id="dl-filter">
            <button data-filter="release" class="active">正式版</button>
            <button data-filter="all">全部</button>
            <button data-filter="snapshot">快照</button>
            <button data-filter="old">远古</button>
          </div>
          <input class="dl-search" id="dl-search" type="text" placeholder="搜索版本号，例如 1.21.4" spellcheck="false">
          <span class="muted small" id="dl-count"></span>
          <button class="kbd-btn" id="dl-refresh" title="重新拉取版本清单">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
            <span>刷新</span>
          </button>
        </div>

        <div class="dl-progress" id="dl-progress" hidden>
          <div class="dl-progress-head">
            <span id="dl-progress-text">准备中…</span>
            <button class="link" id="dl-progress-hide">收起</button>
          </div>
          <div class="bar indeterminate"><i></i></div>
        </div>

        <div class="dl-list" id="dl-list">
          <div class="empty">正在从 Mojang 拉取版本清单…</div>
        </div>
      </section>

      <!-- ================= 设置 ================= -->
      <section class="page" id="page-settings">
        <div class="settings-group">
          <h4>运行环境</h4>
          <div class="card">
            <div class="kv"><span class="k">启动器</span><span class="v" id="about-env"></span></div>
            <div class="kv"><span class="k">WebView</span><span class="v" id="about-ua"></span></div>
          </div>
        </div>
        <div class="settings-group">
          <h4>外观</h4>
          <div class="card">
            <div class="kv">
              <span class="k">主题</span>
              <span class="v">
                <span class="seg" id="theme-seg">
                  <button data-theme-set="light">浅色</button>
                  <button data-theme-set="dark">深色</button>
                </span>
              </span>
            </div>
            <div class="kv">
              <span class="k">侧栏</span>
              <span class="v">
                <span class="seg" id="rail-seg">
                  <button data-rail-set="open">展开</button>
                  <button data-rail-set="closed">收起</button>
                </span>
              </span>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- ================= 图标选择器 ================= -->
<div class="modal hidden" id="icon-modal">
  <div class="modal-body card">
    <div class="modal-head">
      <h3>实例图标</h3>
      <button class="icon-btn" id="icon-close">✕</button>
    </div>

    <div id="icon-step-pick">
      <p class="muted small">选一个内置图标，或者用你自己的图片。</p>
      <div class="icon-grid" id="icon-grid"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="icon-custom">选择图片…</button>
      </div>
    </div>

    <div id="icon-step-crop" hidden>
      <p class="muted small">拖动调整位置，滚轮缩放。最终会裁成正方形 256×256。</p>
      <div class="crop-stage" id="crop-stage">
        <canvas id="crop-canvas" width="360" height="360"></canvas>
        <div class="crop-frame" id="crop-frame"></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="crop-cancel">返回</button>
        <button class="btn primary" id="crop-confirm">使用这张</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast 容器：Java 侧的 showToast 与前端自己的提示都落在这里 -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- 窗口缩放热区 -->
<div class="rz rz-n" data-resize="n"></div>
<div class="rz rz-s" data-resize="s"></div>
<div class="rz rz-w" data-resize="w"></div>
<div class="rz rz-e" data-resize="e"></div>
<div class="rz rz-nw" data-resize="nw"></div>
<div class="rz rz-ne" data-resize="ne"></div>
<div class="rz rz-sw" data-resize="sw"></div>
<div class="rz rz-se" data-resize="se"></div>

<script src="app.js"></script>
</body>
</html>
