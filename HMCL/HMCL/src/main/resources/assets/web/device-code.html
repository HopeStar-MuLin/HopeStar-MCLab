<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录代码</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1b1b1f; color: #f2f2f5;
    font-family: 'Microsoft YaHei UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .t { font-size: 12px; opacity: .6; margin-bottom: 12px; }
  .c {
    font-size: 30px; font-weight: 600; letter-spacing: 6px;
    font-family: ui-monospace, Consolas, monospace;
    color: #7aa2ff; padding: 6px 12px;
  }
  .h { font-size: 11px; opacity: .45; margin-top: 14px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <div class="t">在登录窗口输入此代码</div>
  <div class="c" id="code">----</div>
  <div class="h">关掉登录窗口会取消本次登录</div>
<script>
  var params = new URLSearchParams(location.search);
  var code = params.get('code') || '----';
  document.getElementById('code').textContent = code;
</script>
</body>
</html>
